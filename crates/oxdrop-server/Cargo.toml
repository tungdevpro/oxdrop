[package]
name = "oxdrop-server"
description = "Oxdrop Sender engine, HTTP surface and Receiver page"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
oxdrop-core.workspace = true
axum.workspace = true
dioxus = { workspace = true, default-features = false, features = ["macro", "html", "signals", "hooks"] }
dioxus-ssr.workspace = true
if-addrs.workspace = true
percent-encoding.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "fs", "sync", "macros"] }
tokio-util = { workspace = true, features = ["io"] }
tracing.workspace = true

[dev-dependencies]
percent-encoding.workspace = true
reqwest = { workspace = true }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
