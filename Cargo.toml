[workspace]
resolver = "3"
members = ["crates/oxdrop-core", "crates/oxdrop-server", "crates/oxdrop-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tungdevpro/oxdrop"

[workspace.dependencies]
oxdrop-core = { path = "crates/oxdrop-core" }
oxdrop-server = { path = "crates/oxdrop-server" }
axum = "0.8.9"
base64 = "0.23.1"
crc32fast = "1.5.2"
dioxus = { version = "0.7.10", default-features = false }
dioxus-ssr = "0.7.10"
futures-util = { version = "0.3.34", default-features = false }
getrandom = "0.4.3"
if-addrs = "0.15.0"
percent-encoding = "2.3.2"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.13.5", default-features = false }
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.53.3"
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
zip = { version = "9.0.3", default-features = false }

# CRC-32 runs over every byte of every zipped file; keep it fast in debug builds and tests.
[profile.dev.package.crc32fast]
opt-level = 3
